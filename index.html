<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirect</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-family:sans-serif;">
  <div id="txt">Переходим...</div>

  <script>
    const TARGET = "https://t.me/menstachbot?start=go";

    function go() {
      try {
        if (window.Telegram && Telegram.WebApp) {
          Telegram.WebApp.ready();
          Telegram.WebApp.openTelegramLink(TARGET);
          setTimeout(() => {
            try { Telegram.WebApp.close(); } catch(e) {}
          }, 1200);
          return;
        }
      } catch(e) {}

      window.location.href = TARGET;
    }

    setTimeout(go, 300);
  </script>
</body>
</html>
